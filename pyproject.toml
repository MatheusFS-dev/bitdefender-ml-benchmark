[project]
name = "bdbench-controller"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["click>=8.1", "jsonschema>=4", "psutil>=6", "nvidia-ml-py>=12", "numpy>=2", "scipy>=1.14", "matplotlib>=3.9", "scikit-learn>=1.5"]

[project.scripts]
bdbench = "bdbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdbench"]

[dependency-groups]
dev = ["pytest>=8"]
